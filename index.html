<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ranz Chat</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background:
        radial-gradient(circle at top, #202020, #080808 60%);
    color: white;
    min-height: 100vh;
}

#login {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #050505;
    z-index: 10;
}

.login-box {
    width: min(90%, 400px);
    padding: 35px;
    border-radius: 20px;
    background: #111;
    border: 1px solid #292929;
    box-shadow: 0 0 50px rgba(255,255,255,.05);
}

.logo {
    font-size: 35px;
    font-weight: bold;
    margin-bottom: 10px;
}

.logo span {
    color: #888;
}

.subtitle {
    color: #777;
    margin-bottom: 25px;
}

input {
    width: 100%;
    padding: 15px;
    border-radius: 12px;
    border: 1px solid #333;
    outline: none;
    background: #080808;
    color: white;
    font-size: 16px;
}

button {
    border: none;
    cursor: pointer;
    color: white;
    background: #222;
    padding: 13px 18px;
    border-radius: 12px;
    font-weight: bold;
}

button:hover {
    background: #333;
}

#joinBtn {
    width: 100%;
    margin-top: 15px;
}

#app {
    display: none;
    height: 100vh;
}

.sidebar {
    width: 260px;
    border-right: 1px solid #222;
    background: #0d0d0d;
    padding: 20px;
}

.sidebar h2 {
    margin-top: 0;
}

.status {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #777;
    font-size: 13px;
    margin-bottom: 25px;
}

.dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #777;
}

.dot.online {
    background: #fff;
}

.user {
    padding: 10px;
    margin: 5px 0;
    border-radius: 10px;
    background: #151515;
}

.chat {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.header {
    padding: 20px;
    border-bottom: 1px solid #222;
    background: #0c0c0c;
}

.header-title {
    font-weight: bold;
}

#messages {
    flex: 1;
    overflow-y: auto;
    padding: 25px;
}

.message {
    max-width: 700px;
    margin-bottom: 15px;
}

.message-name {
    font-size: 13px;
    color: #888;
    margin-bottom: 5px;
}

.message-body {
    display: inline-block;
    padding: 12px 15px;
    background: #181818;
    border: 1px solid #292929;
    border-radius: 15px;
    word-break: break-word;
}

.system {
    text-align: center;
    color: #666;
    font-size: 13px;
    margin: 15px 0;
}

.composer {
    padding: 15px;
    border-top: 1px solid #222;
    display: flex;
    gap: 10px;
}

#messageInput {
    flex: 1;
}

#sendBtn {
    width: 90px;
}

#typing {
    height: 20px;
    padding-left: 25px;
    color: #777;
    font-size: 12px;
}

@media (max-width: 700px) {
    .sidebar {
        display: none;
    }

    .chat {
        width: 100%;
    }
}
</style>
</head>

<body>

<div id="login">

    <div class="login-box">

        <div class="logo">
            Ranz<span>Chat</span>
        </div>

        <div class="subtitle">
            Realtime WebSocket Chat
        </div>

        <input
            id="username"
            maxlength="24"
            placeholder="Masukkan username..."
            autocomplete="off"
        >

        <button id="joinBtn">
            MASUK CHAT
        </button>

    </div>

</div>


<div id="app">

    <aside class="sidebar">

        <h2>RanzChat</h2>

        <div class="status">
            <div id="statusDot" class="dot"></div>
            <span id="statusText">Connecting...</span>
        </div>

        <h3>Online</h3>

        <div id="users"></div>

    </aside>


    <main class="chat">

        <div class="header">
            <div class="header-title">
                Global Chat
            </div>
        </div>

        <div id="messages"></div>

        <div id="typing"></div>

        <div class="composer">

            <input
                id="messageInput"
                placeholder="Tulis pesan..."
                autocomplete="off"
                maxlength="2000"
            >

            <button id="sendBtn">
                KIRIM
            </button>

        </div>

    </main>

</div>


<script>

let socket = null;
let username = "";

const login = document.getElementById("login");
const app = document.getElementById("app");

const usernameInput =
    document.getElementById("username");

const joinBtn =
    document.getElementById("joinBtn");

const messageInput =
    document.getElementById("messageInput");

const sendBtn =
    document.getElementById("sendBtn");

const messages =
    document.getElementById("messages");

const users =
    document.getElementById("users");

const typing =
    document.getElementById("typing");

const statusDot =
    document.getElementById("statusDot");

const statusText =
    document.getElementById("statusText");


function addMessage(data) {

    const wrapper =
        document.createElement("div");

    wrapper.className = "message";

    const name =
        document.createElement("div");

    name.className = "message-name";

    name.textContent =
        data.username;

    const body =
        document.createElement("div");

    body.className = "message-body";

    body.textContent =
        data.message;

    wrapper.appendChild(name);
    wrapper.appendChild(body);

    messages.appendChild(wrapper);

    messages.scrollTop =
        messages.scrollHeight;
}


function addSystemMessage(text) {

    const element =
        document.createElement("div");

    element.className = "system";

    element.textContent = text;

    messages.appendChild(element);

    messages.scrollTop =
        messages.scrollHeight;
}


function connect() {

    const protocol =
        location.protocol === "https:"
            ? "wss:"
            : "ws:";

    socket =
        new WebSocket(
            protocol + "//" + location.host
        );


    socket.addEventListener(
        "open",
        () => {

            statusDot.classList.add("online");

            statusText.textContent =
                "Connected";

            socket.send(
                JSON.stringify({
                    type: "join",
                    username
                })
            );

        }
    );


    socket.addEventListener(
        "message",
        event => {

            let data;

            try {
                data = JSON.parse(event.data);
            } catch {
                return;
            }


            if (data.type === "message") {

                addMessage(data);

                return;
            }


            if (data.type === "system") {

                addSystemMessage(
                    data.message
                );

                return;
            }


            if (data.type === "users") {

                users.innerHTML = "";

                data.users.forEach(user => {

                    const item =
                        document.createElement("div");

                    item.className = "user";

                    item.textContent =
                        user.username;

                    users.appendChild(item);

                });

                return;
            }


            if (data.type === "typing") {

                if (data.typing) {

                    typing.textContent =
                        data.username +
                        " sedang mengetik...";

                } else {

                    typing.textContent = "";

                }

                return;
            }


            if (data.type === "error") {

                alert(data.message);

            }

        }
    );


    socket.addEventListener(
        "close",
        () => {

            statusDot.classList.remove("online");

            statusText.textContent =
                "Disconnected";

            setTimeout(() => {

                if (username) {
                    connect();
                }

            }, 3000);

        }
    );

}


joinBtn.addEventListener(
    "click",
    () => {

        const value =
            usernameInput.value.trim();

        if (!value) {
            alert("Masukkan username.");
            return;
        }

        username = value;

        login.style.display = "none";
        app.style.display = "flex";

        connect();

        messageInput.focus();

    }
);


usernameInput.addEventListener(
    "keydown",
    event => {

        if (event.key === "Enter") {
            joinBtn.click();
        }

    }
);


function sendMessage() {

    const text =
        messageInput.value.trim();

    if (!text) return;

    if (
        !socket ||
        socket.readyState !== WebSocket.OPEN
    ) {
        return;
    }

    socket.send(
        JSON.stringify({
            type: "message",
            message: text
        })
    );

    messageInput.value = "";

    socket.send(
        JSON.stringify({
            type: "typing",
            typing: false
        })
    );

}


sendBtn.addEventListener(
    "click",
    sendMessage
);


messageInput.addEventListener(
    "keydown",
    event => {

        if (event.key === "Enter") {

            event.preventDefault();

            sendMessage();

        }

    }
);


let typingTimer;

messageInput.addEventListener(
    "input",
    () => {

        if (
            !socket ||
            socket.readyState !== WebSocket.OPEN
        ) {
            return;
        }

        socket.send(
            JSON.stringify({
                type: "typing",
                typing: true
            })
        );

        clearTimeout(typingTimer);

        typingTimer =
            setTimeout(() => {

                socket.send(
                    JSON.stringify({
                        type: "typing",
                        typing: false
                    })
                );

            }, 1000);

    }
);

</script>

</body>
</html>
